# Trestleboard Configuration
# Run `npm run lint` after editing. It validates diagrams, persona registration,
# and active customizations. See README.md for the complete settings reference.

# Storage backend configuration
storage:
  # Filesystem is the only implemented backend. Database and SharePoint are
  # reserved for future providers; do not select them yet.
  backend: filesystem

  # Intended local project root. tb-init currently always creates projects in
  # projects/, so changing this value does not yet relocate initialized projects.
  filesystem:
    projects_path: projects

  # Reserved settings for the future database provider:
  # database:
  #   connection_string: ""
  #   schema: trestleboard

  # Reserved settings for the future SharePoint provider:
  # sharepoint:
  #   site_url: ""
  #   library: "Trestleboard Documents"
  #   client_id: ""
  #   tenant_id: ""

# Project structure
project:
  # Standard project folders. tb-init currently always creates input and output.
  folders:
    - input
    - output

# Artifact settings
artifacts:
  # Standard Markdown-plus-JSON artifact policy. Individual persona/template
  # workflows currently control artifact generation.
  generate_json: true

  # Schema-validation policy. Use `npm run validate` to validate an artifact.
  validate_schemas: true
  # Built-in schema location. Use tb-validate --schemas-dir for another location.
  schemas_path: schemas

# Diagram formats. Each type has one primary format and can have supplemental formats.
# Each standard type (c4, sequence, wireframe) must have exactly one primary format.
# Modes are primary, supplemental, or disabled. Excalidraw JSON is editable; use
# tb-export-excalidraw to create displayable SVG output.
diagrams:
  formats:
    mermaid:
      c4: primary
      sequence: primary
      wireframe: primary
    excalidraw:
      c4: supplemental
      sequence: disabled
      wireframe: supplemental
      exports:
        - json
        - svg

# Persona settings
personas:
  # Built-in persona directory used by npm run lint.
  path: personas
  # Every built-in persona ID must appear here exactly once.
  available:
    - analyst
    - solution-architect
    - paired-developer
    - quality
    - agile-coach
    - executive-coach

# Customizations: your own personas, persona overloads/overrides,
# document formats (templates) and data files (JSON schemas).
# When enabled is false, only the out-of-box personas and documents are used.
# Run `npm run customize -- init` to create the folder from the shipped examples.
customizations:
  enabled: false
  path: config/customizations
  examples_path: config/customizations.example
