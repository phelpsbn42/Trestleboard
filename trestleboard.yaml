# Trestleboard Configuration
# Controls how and where artifacts are stored and retrieved.

# Storage backend configuration
storage:
  # Backend type: filesystem | database | sharepoint
  backend: filesystem

  # Filesystem settings (used when backend: filesystem)
  filesystem:
    # Base path for projects (relative to Trestleboard root)
    projects_path: projects

  # Database settings (used when backend: database)
  # database:
  #   connection_string: ""
  #   schema: trestleboard

  # SharePoint settings (used when backend: sharepoint)
  # sharepoint:
  #   site_url: ""
  #   library: "Trestleboard Documents"
  #   client_id: ""
  #   tenant_id: ""

# Project structure
project:
  # Folders created for each project
  folders:
    - input
    - output

# Artifact settings
artifacts:
  # Generate JSON alongside markdown
  generate_json: true

  # JSON schema validation
  validate_schemas: true
  schemas_path: schemas

# Diagram formats. Each type has one primary format and can have supplemental formats.
# Excalidraw JSON is editable in Excalidraw; SVG/PNG export requires a renderer integration.
diagrams:
  formats:
    mermaid:
      c4: primary
      sequence: primary
      wireframe: primary
    excalidraw:
      c4: supplemental
      sequence: disabled
      wireframe: supplemental
      exports:
        - json
        - svg

# Persona settings
personas:
  path: personas
  available:
    - analyst
    - solution-architect
    - paired-developer
    - quality
    - agile-coach
    - executive-coach

# Customizations: your own personas, persona overloads/overrides,
# document formats (templates) and data files (JSON schemas).
# When enabled is false, only the out-of-box personas and documents are used.
# Run `npm run customize -- init` to create the folder from the shipped examples.
customizations:
  enabled: false
  path: config/customizations
  examples_path: config/customizations.example
